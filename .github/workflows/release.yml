name: Validate and publish LampaWin

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lampawin-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and run focused checks
        shell: pwsh
        run: ./tools/testing/Run-Checks.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: artifacts/checks/*.json

  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check whether this version needs a release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw src/LampaWin.Desktop/LampaWin.Desktop.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Application version must use major.minor.patch[.revision] format: $version"
          }
          $releaseVersion = $project.Project.PropertyGroup.ReleaseVersion | Where-Object { $_ } | Select-Object -First 1
          if (!$releaseVersion) { $releaseVersion = $version }
          $tag = "v$version"
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            "release_needed=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists; no new release is needed."
          } else {
            "release_needed=true" >> $env:GITHUB_OUTPUT
            "app_version=$version" >> $env:GITHUB_OUTPUT
            "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT
            Write-Host "Will build and publish release $tag."
          }
          $global:LASTEXITCODE = 0

      - name: Acquire pinned app components
        if: steps.version.outputs.release_needed == 'true'
        shell: pwsh
        run: ./tools/packaging/Acquire-Components.ps1

      - name: Build installer and portable archive
        if: steps.version.outputs.release_needed == 'true'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.LAMPAWIN_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.LAMPAWIN_SIGNING_PFX_PASSWORD }}
          LAMPAWIN_TIMESTAMP_SERVER: ${{ vars.LAMPAWIN_TIMESTAMP_SERVER }}
        run: |
          $certificateFile = Join-Path $env:RUNNER_TEMP 'lampawin-signing.pfx'
          try {
            if ($env:SIGNING_PFX_BASE64) {
              [IO.File]::WriteAllBytes($certificateFile, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
              $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
              $certificate = Import-PfxCertificate -FilePath $certificateFile -CertStoreLocation Cert:\CurrentUser\My -Password $password
              $env:LAMPAWIN_SIGNING_THUMBPRINT = $certificate.Thumbprint
            }
            ./tools/packaging/Build-Release.ps1
          } finally {
            if (Test-Path -LiteralPath $certificateFile) { Remove-Item -LiteralPath $certificateFile -Force }
            if ($certificate) { Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $certificate.Thumbprint) -Force }
          }

      - name: Verify the assembled application offline
        if: steps.version.outputs.release_needed == 'true'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath artifacts/publish/LampaWin.exe -ArgumentList @('--verify-package', '--fixture', ((Resolve-Path tests/assets/player-fixture.mp4).Path), '--report', ((Join-Path $pwd 'artifacts/package-check.json'))) -PassThru -WindowStyle Hidden
          if (!$process.WaitForExit(60000)) { Stop-Process -Id $process.Id -Force; throw 'Package verification timeout' }
          if ($process.ExitCode -ne 0) { throw 'Package verification failed' }
          $report = Get-Content -Raw artifacts/package-check.json | ConvertFrom-Json
          if (!$report.success) { throw 'Package report failed' }

      - name: Publish GitHub release
        if: steps.version.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notesFile = "releases/${{ steps.version.outputs.release_version }}.md"
          $notesArguments = if (Test-Path -LiteralPath $notesFile) { @('--notes-file', $notesFile) } else { @('--generate-notes') }
          $signatureArguments = if (Test-Path artifacts/SHA256SUMS.txt.p7s) { @('artifacts/SHA256SUMS.txt.p7s') } else { @() }
          gh release create "v${{ steps.version.outputs.app_version }}" `
            artifacts/LampaWin-Setup-win-x64.exe `
            artifacts/LampaWin-win-x64-portable.zip `
            artifacts/SHA256SUMS.txt `
            @signatureArguments `
            --title "LampaWin ${{ steps.version.outputs.release_version }}" `
            --latest `
            @notesArguments
